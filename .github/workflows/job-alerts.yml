name: Job Alerts

on:
  # Main schedule: an external timer (cron-job.org) calls the GitHub API to
  # trigger this workflow, hourly 7am-9pm Toronto time and every 3 hours
  # overnight. See "Schedule" in the README. GitHub's own cron is unreliable
  # under load (it was firing only 3-5 times a day), so it's kept only as an
  # occasional backup, at an odd minute to avoid the busy top of the hour.
  schedule:
    - cron: "23 */3 * * *"  # backup: every 3 hours (UTC)
  workflow_dispatch: {}  # used by the external timer, and the "Run workflow" button

permissions:
  contents: write  # needed so the workflow can commit the updated state.json

# Never let two runs overlap: both would read the same state.json and could
# post the same jobs twice, then race to push.
concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job checker
        env:
          # Default channel: gets any job without a category, and any category
          # whose own webhook secret below isn't set yet.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # One webhook per channel (see "categories" in config.json).
          DISCORD_WEBHOOK_DEV: ${{ secrets.DISCORD_WEBHOOK_DEV }}
          DISCORD_WEBHOOK_DATA: ${{ secrets.DISCORD_WEBHOOK_DATA }}
          DISCORD_WEBHOOK_IT: ${{ secrets.DISCORD_WEBHOOK_IT }}
          DISCORD_WEBHOOK_ANALYST: ${{ secrets.DISCORD_WEBHOOK_ANALYST }}
        run: python check_jobs.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --quiet --staged; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "Update job state [skip ci]"
          # If main moved during the run (e.g. a PR was merged), rebase onto it
          # instead of failing the push and losing this run's state.
          git pull --rebase origin main
          git push
