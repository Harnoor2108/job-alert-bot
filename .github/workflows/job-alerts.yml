name: Job Alerts

on:
  schedule:
    # Every 15 minutes. GitHub Actions cron can lag under load, treat as approximate.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated state.json

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run job checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_jobs.py

      - name: Commit updated state
        run: |
          git config user.name "Harnoor2108"
          git config user.email "harnooryuv@gmail.com"
          git add state.json
          git diff --quiet --staged || git commit -m "Update job state [skip ci]"
          git push
